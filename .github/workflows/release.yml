# Test every pull request. When something lands on main, test again and publish it to https://hoppinclub.com.
# Needs repository secrets JFROG_NPM_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and variables
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY. See docs/deploy.md.
name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Packages come only from the company Artifactory (the lockfile points there), never the public registry.
          registry-url: https://entplus.jfrog.io/artifactory/api/npm/npm-virtual/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.JFROG_NPM_TOKEN }}
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.JFROG_NPM_TOKEN }}
      - run: npm run typecheck
      - run: npm test
      - name: Build (also checks the offline cache stays small)
        working-directory: apps/web
        run: |
          npx vite build | tee build.log
          size=$(grep -oE 'precache +[0-9]+ entries \(([0-9.]+) KiB\)' build.log | grep -oE '\(([0-9.]+)' | tr -d '(')
          echo "offline cache: ${size} KiB"
          awk -v s="$size" 'BEGIN { exit (s > 1500) }' || { echo "Offline cache is over 1500 KiB"; exit 1; }
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hoppinclub.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://entplus.jfrog.io/artifactory/api/npm/npm-virtual/
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy apps/web/dist --project-name hoppinclub --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.JFROG_NPM_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the site answers
        run: |
          sleep 10
          for path in / /sign-in; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://hoppinclub.com$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
