<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved palette and light/dark choice before the first paint, so there is no flash of the wrong colours.
      try {
        var r = document.documentElement,
          p = localStorage.getItem("hoppin.palette"),
          m = localStorage.getItem("hoppin.mode");
        if (["cobalt", "rose", "lilac", "tangerine"].indexOf(p) > -1) r.setAttribute("data-palette", p);
        r.setAttribute("data-theme", m === "dark" ? "dark" : "light"); // light unless dark was chosen; the phone setting is ignored
        r.style.colorScheme = m === "dark" ? "dark" : "light";
      } catch (e) {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Hoppin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
